server.port=${PORT:8080}
spring.datasource.url=${AISELL_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BD_AISELL;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${AISELL_DB_USER:sa}
spring.datasource.password=${AISELL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
aisell.jwt.secret=${AISELL_JWT_SECRET:}
aisell.demo.enabled=${AISELL_DEMO_USERS:false}
aisell.demo.admin.password=${AISELL_ADMIN_PASSWORD:admin123}
aisell.demo.vendedor.password=${AISELL_VENDEDOR_PASSWORD:vendedor123}
aisell.demo.repartidor.password=${AISELL_REPARTIDOR_PASSWORD:repartidor123}
